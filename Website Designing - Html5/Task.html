<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Media and Graphics Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    canvas {
      border: 1px solid #000;
      margin-bottom: 20px;
    }
    svg {
      border: 1px solid #000;
    }
  </style>
</head>
<body>

  <h2>🎵 Audio with Muted, Loop, and Autoplay</h2>
  <audio controls muted loop autoplay>
    <source src="your-audio-file.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <h2>🎥 Video with Muted, Loop, and Autoplay</h2>
  <video width="320" height="240" controls muted loop autoplay>
    <source src="your-video-file.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h2>🎨 Canvas Shapes</h2>
  <canvas id="myCanvas" width="300" height="200"></canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Rectangle
    ctx.fillStyle = "#FF0000";
    ctx.fillRect(20, 20, 100, 50);

    // Circle
    ctx.beginPath();
    ctx.arc(200, 50, 30, 0, 2 * Math.PI);
    ctx.fillStyle = "#00FF00";
    ctx.fill();

    // Triangle
    ctx.beginPath();
    ctx.moveTo(150, 150);
    ctx.lineTo(100, 100);
    ctx.lineTo(200, 100);
    ctx.closePath();
    ctx.fillStyle = "#0000FF";
    ctx.fill();
  </script>

  <h2>🖼️ SVG Shapes</h2>
  <svg width="300" height="200">
    <!-- Rectangle -->
    <rect x="10" y="10" width="100" height="50" fill="red" />
    
    <!-- Circle -->
    <circle cx="200" cy="35" r="30" fill="green" />

    <!-- Triangle (polygon) -->
    <polygon points="150,150 100,100 200,100" fill="blue" />
  </svg>

</body>
</html>
